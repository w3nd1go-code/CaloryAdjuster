<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grocery Budget Planner</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2320;--mut:#5f6b64;--line:#dfe4de;--acc:#1f7a4d;--onacc:#fff;--bad:#b3261e;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111513;--card:#1a201d;--ink:#e8ece9;--mut:#9aa7a0;--line:#2b3430;--acc:#4cc38a;--onacc:#0b1f15;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#111513;--card:#1a201d;--ink:#e8ece9;--mut:#9aa7a0;--line:#2b3430;--acc:#4cc38a;--onacc:#0b1f15;--bad:#ff8a80}

*{box-sizing:border-box}
html, body { height: 100vh; overflow: hidden; }
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

main {
  max-width: 1800px;
  height: 100vh;
  margin: 0 auto;
  padding: 12px 16px;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 10px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 6px;
}
h1{font-size:1.25rem;margin:0}
h2{font-size:0.95rem;margin:0 0 .4em}
a{color:var(--acc)}.mut,small{color:var(--mut)}small{display:block;font-size:.75rem}

.app-grid {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 12px;
  min-height: 0; /* Prevents overflow grid expansion */
}

.left-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.right-panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
.g3{display:grid;grid-template-columns:1fr;gap:6px}
label{display:block;font-size:.8rem;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;margin-top:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:4px 10px;background:var(--acc);color:var(--onacc)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:6px;margin-top:4px}
.m{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:3px 0 4px}.m div{height:100%;background:var(--acc)}.m .bad{background:var(--bad)}
.badt{color:var(--bad);font-weight:600}.okt{color:var(--acc);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.bar button{margin-left:4px}
.cat{font-size:.75rem;font-weight:bold;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:8px 0 2px;padding-top:4px;border-top:1px dashed var(--line)}
.cat:first-child{border-top:none;margin-top:0}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0;border-top:1px solid var(--line);transition:opacity 0.2s}
.r:first-of-type{border-top:none}
.r.excluded{opacity:0.45}
.nm{flex:1 1 180px;display:flex;align-items:center;gap:8px}
.nm input[type="checkbox"]{width:16px;height:16px;margin:0;cursor:pointer;flex-shrink:0}
.ct{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ct label{display:flex;align-items:center;gap:2px;font-size:0.75rem}.ct input{width:65px;margin:0;padding:3px 4px}
.ct button{padding:2px 8px;font-size:0.8rem}.ct b{min-width:1.2em;text-align:center}
summary{cursor:pointer;font-weight:600;font-size:0.9rem}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin:6px 0}

/* Internal Scrollable area for Grocery items */
#list-container {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-right: 4px;
}
#list-container::-webkit-scrollbar { width: 6px; }
#list-container::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
</style></head><body><main>
<header>
  <h1>Grocery Budget Planner</h1>
  <p class="mut" style="margin:0">Edit any price or calorie number in the list to match what you see in store. Saved in this browser.</p>
</header>

<div class="app-grid">
  <div class="left-panel">
    <section class="card">
      <h2>Your limits</h2>
      <div class="g3">
        <label>Calories per day<input id="kcal" type="number" min="0" step="50"></label>
        <label>Money limit for the period ($)<input id="budget" type="number" min="0" step="5"></label>
        <label>Days<input id="days" type="number" min="1" step="1"></label>
      </div>
    </section>

    <section class="card" id="sum"></section>

    <details class="card" open>
      <summary>Add an item</summary>
      <div class="f">
        <label>Name<input id="an"></label>
        <label>Price ($)<input id="ap" type="number" step="0.01" min="0"></label>
        <label>Calories/pkg<input id="ak" type="number" min="0"></label>
      </div>
      <button id="add" style="width:100%;margin-top:4px">Add item</button>
    </details>
  </div>

  <div class="right-panel">
    <section class="card" style="display:flex;flex-direction:column;height:100%;min-height:0">
      <div class="bar" style="margin-bottom:6px">
        <h2>Groceries</h2>
        <span><button id="auto">Auto-fill</button><button id="clr" class="ghost">Clear</button></span>
      </div>
      <p class="mut" style="margin:0 0 6px 0">Auto-fill spreads packs across food groups by calories per dollar.</p>
      <div id="list-container">
        <div id="list"></div>
      </div>
    </section>
  </div>
</div>

</main>
<script>
const K="gbp1",CATS=["Grains","Protein","Produce","Dairy","Pantry"];
const OLD="Long-grain rice, 2 lb|Spaghetti, 16 oz|Rolled oats, 18 oz|Sandwich bread, 1 loaf|Flour tortillas, 10 ct|Eggs, 1 dozen|Chicken breast, 3 lb|Ground beef 80/20, 1 lb|Dry black beans, 1 lb|Dry lentils, 1 lb|Canned tuna, 5 oz|Peanut butter, 16 oz|Bananas, 1 lb|Apples, 3 lb bag|Carrots, 2 lb|Russet potatoes, 5 lb|Frozen mixed vegetables, 12 oz|Milk 2%, 1 gal|Cheddar cheese, 8 oz|Plain nonfat Greek yogurt, 32 oz|Canned tomatoes, 28 oz|Vegetable oil, 48 oz".split("|");
let S={kcal:2000,budget:300,days:7,items:[]};
try{const t=JSON.parse(localStorage.getItem(K));if(t&&t.items){S=Object.assign(S,t);S.items=S.items.filter(i=>!OLD.includes(i.n))}}catch(e){}

// Ensure backwards compatibility for items missing the 'inc' property
S.items.forEach(i => { if (i.inc === undefined) i.inc = true; });

const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Math.round(n).toLocaleString("en-US"),usd=n=>"$"+n.toFixed(2);
const meter=v=>`<div class="m"><div class="${v>1?"bad":""}" style="width:${Math.min(100,v*100)}%"></div></div>`;
function render(){
 $("kcal").value=S.kcal;$("budget").value=S.budget;$("days").value=S.days;
 
 // Only sum items that are checked (i.inc !== false)
 const incItems = S.items.filter(i => i.inc !== false);
 const sp=incItems.reduce((a,i)=>a+i.p*i.q,0),kc=incItems.reduce((a,i)=>a+i.k*i.q,0),d=S.days||1,pd=kc/d;
 const oB=sp>S.budget,oK=pd>S.kcal;
 
 $("sum").innerHTML=`<h2>${d}-day plan</h2>
 <div class="row"><span><b>${usd(sp)}</b> of ${usd(S.budget)}</span><span class="${oB?"badt":"okt"}">${oB?usd(sp-S.budget)+" over":usd(S.budget-sp)+" left"}</span></div>${meter(S.budget>0?sp/S.budget:0)}
 <div class="row"><span><b>${fmt(pd)}</b> kcal/day of ${fmt(S.kcal)}</span><span class="${oK?"badt":"okt"}">${oK?fmt(pd-S.kcal)+" over":fmt(S.kcal-pd)+" under"}</span></div>${meter(S.kcal>0?pd/S.kcal:0)}
 <p class="mut" style="margin:4px 0 0 0">${fmt(kc)} kcal total · ${fmt(S.kcal*d)} kcal limit · ${usd(sp/d)}/day</p>`;
 
 $("list").innerHTML=CATS.map((c,ci)=>{
  const rows=S.items.map((i,x)=>[i,x]).filter(([i])=>i.c===ci);if(!rows.length)return"";
  return`<div class="cat">${c}</div>`+rows.map(([i,x])=>`<div class="r ${i.inc !== false ? '' : 'excluded'}">
  <div class="nm">
    <input type="checkbox" data-i="${x}" data-f="inc" ${i.inc !== false ? 'checked' : ''} title="Include in totals">
    <div>${esc(i.n)}<small>${usd(i.p*i.q)} · ${fmt(i.k*i.q)} kcal</small></div>
  </div>
  <div class="ct"><label>$<input data-i="${x}" data-f="p" type="number" step="0.01" min="0" value="${i.p}"></label>
  <label><input data-i="${x}" data-f="k" type="number" min="0" value="${i.k}">kcal</label>
  <button data-i="${x}" data-a="-" class="ghost">−</button><b>${i.q}</b><button data-i="${x}" data-a="+">+</button><button data-i="${x}" data-a="x" class="ghost" title="Remove">×</button></div></div>`).join("");
 }).join("")||`<p class="mut">No items yet. Add your own below.</p>`;
 save();
}
$("kcal").onchange=e=>{S.kcal=Math.max(0,+e.target.value||0);render()};
$("budget").onchange=e=>{S.budget=Math.max(0,+e.target.value||0);render()};
$("days").onchange=e=>{S.days=Math.max(1,Math.round(+e.target.value||1));render()};
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i,a=b.dataset.a,it=S.items[i];
 if(a==="+")it.q++;else if(a==="-")it.q=Math.max(0,it.q-1);else if(a==="x")S.items.splice(i,1);render()};
$("list").onchange=e=>{
  const t=e.target;if(!t.dataset.f)return;
  if(t.dataset.f === "inc") {
    S.items[+t.dataset.i].inc = t.checked;
  } else {
    S.items[+t.dataset.i][t.dataset.f]=Math.max(0,+t.value||0);
  }
  render();
};
$("clr").onclick=()=>{S.items.forEach(i=>i.q=0);render()};
$("auto").onclick=()=>{
 S.items.forEach(i=>i.q=0);const target=S.kcal*S.days*.95;let sp=0,kc=0,added=true,n=0;
 while(added&&n++<3000){added=false;
  for(let c=0;c<CATS.length;c++){
   const opts=S.items.filter(i=>i.c===c&&i.p>0&&i.k>0&&i.k<=target*.25&&sp+i.p<=S.budget&&kc+i.k<=target&&i.inc!==false);
   if(!opts.length)continue;
   opts.sort((a,b)=>a.q-b.q||b.k/b.p-a.k/a.p);const it=opts[0];it.q++;sp+=it.p;kc+=it.k;added=true}}
 render()};
$("add").onclick=()=>{const n=$("an").value.trim(),p=+$("ap").value,k=+$("ak").value;if(!n||!(p>=0)||!(k>=0))return;
 S.items.push({n,c:0,p,k,q:0,inc:true});["an","ap","ak"].forEach(id=>$(id).value="");render()};
render();
</script></body></html>
